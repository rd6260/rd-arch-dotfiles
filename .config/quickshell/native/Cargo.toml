[package]
name = "native"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "synced-lyrics"
path = "src/bin/synced-lyrics/main.rs"

[[bin]]
name = "phone-present"
path = "src/bin/phone-present.rs"

[dependencies]
# synced-lyrics
rustls = "0.23"
webpki-roots = "0.26"
# phone-present
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "process"] }
futures = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
